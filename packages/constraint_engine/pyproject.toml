[project]
name = "constraint-engine"
version = "0.0.0"
description = "Constraint detection, forecast and euro quantification. Open-source candidate."
requires-python = ">=3.12"
dependencies = [
    "cip-schema",
    "polars>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constraint_engine"]

[tool.uv.sources]
cip-schema = { workspace = true }
