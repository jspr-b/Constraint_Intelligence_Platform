case: ridder_hours
style: 'Ridder iQ-like hour bookings only: start date, start time and duration per job and step, no scans,
  setups or stops'
rule: ADR-0011. Derived from the plant's true mapping before the wizard exists; never edited.
plant: plant_a
plant_answer: data/synthetic/plant_a/expected_answers.yaml
answer:
  constraint: PNT-01
  confidence: 'lower than high, and said in plain words: times come from hour bookings'
  not_compared: 'lost euros and loss causes: bookings have no setups, stops or scans'
format:
  delimiter: ;
  decimal: ','
  datetime: '%d-%m-%Y %H:%M'
  timezone: Europe/Amsterdam
  title_lines_above_header: 0
  totals_line_at_end: false
  byte_order_mark: false
files:
  Artikelen.csv:
    role: products
  Bewerkingen.csv:
    role: routings
  Productieorders.csv:
    role: orders
  Rooster.csv:
    role: calendar
  Urenregistratie.csv:
    role: hour_bookings
  Werkplekken.csv:
    role:
    - resources
    - stations
columns:
  Artikelen.csv:
    Artikel: products.sku
    Omschrijving: products.name
    Productgroep: products.family
    Kleurgroep: products.setup_family
    Verkoopprijs: products.sales_price_eur_cents
    Variabele kosten: products.truly_variable_cost_eur_cents
  Bewerkingen.csv:
    Artikel: routings.sku
    Bewerking nr: routings.operation_seq
    Bewerking: routings.operation
    Werkplek: routings.resource_code
    Alternatief: routings.alternative_resource_codes
    Insteltijd (min): routings.standard_setup_min
    Stuktijd (min): routings.standard_run_min_per_unit
  Productieorders.csv:
    Productieorder: orders.order_id
    Artikel: orders.sku
    Aantal: orders.quantity_units
    Leverdatum: orders.due_at
    Status: orders.status
    Vrijgegeven: orders.released_at
    Verzonden: orders.shipped_at
    Materiaal gereed: orders.material_ready_at
  Rooster.csv:
    Werkplekcode: calendar.resource_code
    Type: calendar.kind
    Start: calendar.start_at
    Einde: calendar.end_at
    Overgenomen: calendar.covered
  Urenregistratie.csv:
    Productieorder: events.order_id
    Bewerkingsnr: events.operation_seq
    Werkplekcode: events.resource_code
    Datum:
      date part of: booking start
    Begintijd:
      time part of: booking start
    Duur (min): booking duration_min
    Gereed gemeld: events.quantity_units
  Werkplekken.csv:
    Werkplekcode: resources.resource_code
    Werkplek: resources.name
    Afdeling:
    - resources.station_code
    - stations.name
    - stations.station_code
