[project]
name = "cip-workers"
version = "0.0.0"
description = "Background jobs."
requires-python = ">=3.12"
dependencies = [
    "cip-api",
    "constraint-engine",
    "dramatiq[redis]>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip_workers"]

[tool.uv.sources]
constraint-engine = { workspace = true }
cip-api = { workspace = true }
