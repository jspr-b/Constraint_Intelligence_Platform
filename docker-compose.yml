# Local stack. Data services now; api, web and worker are added by later sequences.
# Host ports are offset (55432, 56379) to avoid clashing with other local databases.
name: cip

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${CIP_DB_NAME:-cip}
      POSTGRES_USER: ${CIP_DB_OWNER:-cip_owner}
      POSTGRES_PASSWORD: ${CIP_DB_OWNER_PASSWORD:-cip_owner_dev}
    ports:
      - "${CIP_DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "${CIP_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  redis_data:
