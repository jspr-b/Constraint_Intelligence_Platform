case: exact_en
style: 'Exact Globe-like export in English: comma separated, ISO dates, decimal point'
rule: ADR-0011. Derived from the plant's true mapping before the wizard exists; never edited.
plant: plant_a
plant_answer: data/synthetic/plant_a/expected_answers.yaml
answer: plant_answer
format:
  delimiter: ','
  decimal: .
  datetime: '%Y-%m-%d %H:%M'
  timezone: Europe/Amsterdam
  title_lines_above_header: 0
  totals_line_at_end: false
  byte_order_mark: false
files:
  Changeovers.csv:
    role: changeovers
  Customers.csv:
    role: not_used
    reason: 'Customer list: not needed to find what limits output.'
  Items.csv:
    role: products
  Overtime.csv:
    role: overtime
  ProductionOrders.csv:
    role: orders
  ResourceCosts.csv:
    role: capacity_costs
  Resources.csv:
    role:
    - resources
    - stations
  Roster.csv:
    role: calendar
  Routings.csv:
    role: routings
  ShopFloorEvents.csv:
    role: events
  Subcontracting.csv:
    role: outsourcing
columns:
  Changeovers.csv:
    Resource: changeovers.resource_code
    From colour: changeovers.from_setup_family
    To colour: changeovers.to_setup_family
    Changeover (min): changeovers.changeover_min
  Items.csv:
    Item code: products.sku
    Description: products.name
    Item group: products.family
    Colour group: products.setup_family
    Sales price: products.sales_price_eur_cents
    Variable cost: products.truly_variable_cost_eur_cents
  Overtime.csv:
    Resource: overtime.resource_code
    Year: overtime.iso_year
    Week: overtime.iso_week
    Hours: overtime.overtime_h
  ProductionOrders.csv:
    Order number: orders.order_id
    Item code: orders.sku
    Quantity: orders.quantity_units
    Delivery date: orders.due_at
    Status: orders.status
    Released on: orders.released_at
    Delivered on: orders.shipped_at
    Material available: orders.material_ready_at
  ResourceCosts.csv:
    Resource: capacity_costs.resource_code
    Overtime rate: capacity_costs.overtime_eur_cents_per_h
    Extra shift cost: capacity_costs.extra_shift_eur_cents
  Resources.csv:
    Resource: resources.resource_code
    Description: resources.name
    Department:
    - resources.station_code
    - stations.name
    - stations.station_code
  Roster.csv:
    Resource: calendar.resource_code
    Type: calendar.kind
    From: calendar.start_at
    To: calendar.end_at
    Covered: calendar.covered
  Routings.csv:
    Item code: routings.sku
    Step no: routings.operation_seq
    Operation: routings.operation
    Resource: routings.resource_code
    Alternative resource: routings.alternative_resource_codes
    Setup time (min): routings.standard_setup_min
    Run time per unit (min): routings.standard_run_min_per_unit
  ShopFloorEvents.csv:
    Resource: events.resource_code
    Department: events.station_code
    Order number: events.order_id
    Step no: events.operation_seq
    Event: events.event_type
    Timestamp: events.at
    Good qty: events.quantity_units
    Rejected qty: events.scrap_units
    Breakdown code: events.down_reason_code
    Reject code: events.scrap_reason_code
    Employee: personal (dropped on read, never shown or sent)
  Subcontracting.csv:
    Operation: outsourcing.operation
    Unit price: outsourcing.price_eur_cents_per_unit
code_tables:
  resource:
    SNIJ1: CUT-01
    LAS1: WLD-01
    LAS2: WLD-02
    LAK1: PNT-01
    MONT1: ASM-01
    INPAK1: PCK-01
  station:
    Cutting: CUTTING
    Welding cell: WELD-CELL
    Paint: PAINT
    Assembly: ASSEMBLY
    Packing: PACKING
  event_status:
    STARTED: start
    FINISHED: end
    SETUP BEGIN: setup_start
    SETUP END: setup_end
    BREAKDOWN: down_start
    REPAIRED: down_end
    REJECTED: scrap
    ARRIVED: scan
    DEPARTED: move
  order_status:
    Open: open
    Released: released
    In process: in_progress
    Delivered: shipped
  calendar_kind:
    Shift: shift
    Break: break
    Maintenance: maintenance
    Public holiday: holiday
