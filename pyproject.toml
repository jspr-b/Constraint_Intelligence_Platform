[project]
name = "constraint-intelligence-platform"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/schema", "packages/constraint_engine", "packages/connectors", "apps/api", "workers"]

[tool.uv.sources]
cip-schema = { workspace = true }
constraint-engine = { workspace = true }
cip-connectors = { workspace = true }
cip-api = { workspace = true }
cip-workers = { workspace = true }

[dependency-groups]
dev = [
    "cip-schema",
    "constraint-engine[synthetic]",
    "cip-connectors",
    "cip-api",
    "cip-workers",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-openpyxl>=3.1",
    "types-pyyaml>=6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Formula texts shown to users use proper math symbols.
allowed-confusables = ["−", "×", "÷"]

[tool.mypy]
strict = true
# Package sources resolve by import name; test files get unique path-based names, so the
# conftest.py of each package does not clash.
mypy_path = ["packages/schema/src", "packages/constraint_engine/src", "packages/connectors/src", "apps/api/src", "workers/src", "apps/api/tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["packages", "apps/api", "workers"]
exclude = ["/node_modules/"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
testpaths = ["packages", "apps/api", "workers"]
# Shared API test helpers (cip_api_testkit) are importable from test modules.
pythonpath = ["apps/api/tests"]
markers = [
    "db: needs the Postgres service from docker compose",
    "slow: long-running (regeneration, simulation)",
]

[[tool.mypy.overrides]]
module = ["simpy", "simpy.*", "dramatiq", "dramatiq.*"]
ignore_missing_imports = true

# Dramatiq's broker and middleware constructors are untyped; only the broker module calls them.
[[tool.mypy.overrides]]
module = ["cip_api.jobs"]
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint.isort]
known-first-party = ["cip_schema", "constraint_engine", "cip_connectors", "cip_api", "cip_workers", "cip_api_testkit"]
