# Development overrides: API and worker run from the bind-mounted source with hot reload (the
# worker needs a restart after backend changes). Run the web app on the host with
# `pnpm --filter web dev` (the web image is not used here).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up db redis migrate api worker
x-dev: &dev
  image: ghcr.io/astral-sh/uv:0.5.11-python3.12-bookworm-slim
  build: !reset null
  working_dir: /app
  user: root

services:
  migrate:
    <<: *dev
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--package",
        "cip-api",
        "--directory",
        "apps/api",
        "alembic",
        "upgrade",
        "head",
      ]
    environment:
      {
        UV_PROJECT_ENVIRONMENT: /opt/venv,
        UV_LINK_MODE: copy,
        CIP_DB_HOST: db,
        CIP_DB_PORT: "5432",
      }
    volumes: [".:/app", "api_venv:/opt/venv"]

  api:
    <<: *dev
    command: >
      uv run --frozen --package cip-api uvicorn cip_api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir apps/api/src --reload-dir packages
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      CIP_ENV: dev
      CIP_DB_HOST: db
      CIP_DB_PORT: "5432"
      CIP_REDIS_HOST: redis
      CIP_REDIS_PORT: "6379"
    volumes: !override [".:/app", "api_venv:/opt/venv"]

  worker:
    <<: *dev
    command: >
      uv run --frozen --package cip-workers dramatiq cip_workers.actors --processes 1 --threads 2
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      CIP_ENV: dev
      CIP_DB_HOST: db
      CIP_DB_PORT: "5432"
      CIP_REDIS_HOST: redis
      CIP_REDIS_PORT: "6379"
    volumes: !override [".:/app", "worker_venv:/opt/venv"]

volumes:
  api_venv:
  worker_venv:
