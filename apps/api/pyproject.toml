[project]
name = "cip-api"
version = "0.0.0"
description = "FastAPI service."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cip-schema",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip_api"]

[tool.uv.sources]
cip-schema = { workspace = true }
