# Full local stack from the production images (infra/docker): data services, migrations, API,
# worker and web. Build with `bash scripts/build_images.sh` (stamps the source id), start with
# `docker compose up -d --no-build`, check with `bash scripts/check_images.sh`; open http://localhost:53000.
# For hot reload while developing: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Host ports are offset (55432, 56379, 58000, 53000) to avoid clashing with other local projects.
# CIP_ENV=dev here enables the pilot email sign-in; real deployments set their own environment.
name: cip

x-app-env: &app-env
  CIP_ENV: ${CIP_ENV:-dev}
  CIP_DB_HOST: db
  CIP_DB_PORT: "5432"
  CIP_REDIS_HOST: redis
  CIP_REDIS_PORT: "6379"
  # Minutes before a recalculation counts as stuck and is offered for a retry.
  CIP_REFRESH_TIMEOUT_MIN: ${CIP_REFRESH_TIMEOUT_MIN:-10}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${CIP_DB_NAME:-cip}
      POSTGRES_USER: ${CIP_DB_OWNER:-cip_owner}
      POSTGRES_PASSWORD: ${CIP_DB_OWNER_PASSWORD:-cip_owner_dev}
    ports:
      - "${CIP_DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "${CIP_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args: { CIP_SOURCE_ID: "${CIP_SOURCE_ID:-unknown}" }
    image: cip-api:local
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    # Same image as migrate; both build it so `docker compose build api` is never a no-op.
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args: { CIP_SOURCE_ID: "${CIP_SOURCE_ID:-unknown}" }
    image: cip-api:local
    environment: *app-env
    volumes:
      - import_data:/app/var/data
    ports:
      - "${CIP_API_PORT:-58000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
      args: { CIP_SOURCE_ID: "${CIP_SOURCE_ID:-unknown}" }
    image: cip-worker:local
    environment: *app-env
    volumes:
      - import_data:/app/var/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { CIP_SOURCE_ID: "${CIP_SOURCE_ID:-unknown}" }
    image: cip-web:local
    environment:
      CIP_ENV: ${CIP_ENV:-dev}
      CIP_API_URL: http://api:8000
      # The tenant this web host signs people into (one per deployment).
      CIP_TENANT_ID: ${CIP_TENANT_ID:-}
      CIP_DEV_TENANT_ID: ${CIP_DEV_TENANT_ID:-}
    ports:
      - "${CIP_WEB_PORT:-53000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  import_data:
